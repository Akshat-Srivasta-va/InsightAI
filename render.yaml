services:
  - type: web
    name: insightai-backend
    runtime: java
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/research-assistant-0.0.1-SNAPSHOT.jar
    envVars:
      - key: GEMINI_KEY
        sync: false
      - key: JAVA_VERSION
        value: 17
